apiVersion: apps/v1
kind: Deployment
metadata:
  name: onges-core-api
  namespace: onges-ns
spec:
  replicas: 2
  selector:
    matchLabels: { app: onges-core-api }
  template:
    metadata:
      labels: { app: onges-core-api }
    spec:
      containers:
        - name: onges-core-api
          image: onges-core-api:latest
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: onges-config }
            - secretRef: { name: onges-secrets }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
