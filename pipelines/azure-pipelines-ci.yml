trigger:
  branches:
    include: [main]
  paths:
    include:
      - pipelines/azure-pipelines-ci.yml
      - docker/**

resources:
  repositories:
    - repository: ongescore
      type: github
      name: PAIFteam/OngES-Core
      endpoint: PAIFteam
      ref: refs/heads/main
      trigger:
        branches:
          include: [main]
    - repository: ongesworker
      type: github
      name: PAIFteam/OngES-Worker
      endpoint: PAIFteam
      ref: refs/heads/main
      trigger:
        branches:
          include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  coreImageRepository: onges-core-api
  workerImageRepository: onges-worker
  ACR_LOGIN_SERVER: acrpaifgamesdev.azurecr.io

stages:
  - stage: Validate
    jobs:
      - job: Build
        steps:
          - checkout: self
            path: s/onges-infra
          - checkout: ongescore
            path: s/onges-core
          - checkout: ongesworker
            path: s/onges-worker
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: 8.0.x
          - bash: |
              set -euo pipefail
              CORE_SOLUTION="$(Pipeline.Workspace)/s/onges-core/src/OngES-Core-API.sln"
              WORKER_SOLUTION="$(Pipeline.Workspace)/s/onges-worker/src/OngES-Worker-API.sln"
              echo "Compilando Core:"
              echo "$CORE_SOLUTION"
              dotnet restore "$CORE_SOLUTION"
              dotnet build "$CORE_SOLUTION" \
                --configuration "$(buildConfiguration)" \
                --no-restore
              echo "Compilando Worker:"
              echo "$WORKER_SOLUTION"
              dotnet restore "$WORKER_SOLUTION"
              dotnet build "$WORKER_SOLUTION" \
                --configuration "$(buildConfiguration)" \
                --no-restore
            displayName: Restore e build

  - stage: Container
    dependsOn: Validate
    jobs:
      - job: BuildPush
        steps:
          - checkout: self
            path: s/onges-infra
          - checkout: ongescore
            path: s/onges-core
          - checkout: ongesworker
            path: s/onges-worker
          - task: Docker@2
            inputs:
              command: login
              containerRegistry: dockerpaifgames
          # ======== BLOCO DE DIAGNÓSTICO ========
          - bash: |
              echo "========================================="
              echo "Estrutura do OngES-Core"
              echo "========================================="
              find "$(Pipeline.Workspace)/s/onges-core" -maxdepth 4 -type f | sort
              echo ""
              echo "Projetos (.csproj) do OngES-Core"
              find "$(Pipeline.Workspace)/s/onges-core" -name "*.csproj" | sort
              echo ""
              echo "========================================="
              echo "Estrutura do OngES-Worker"
              echo "========================================="
              find "$(Pipeline.Workspace)/s/onges-worker" -maxdepth 4 -type f | sort
              echo ""
              echo "Projetos (.csproj) do OngES-Worker"
              find "$(Pipeline.Workspace)/s/onges-worker" -name "*.csproj" | sort
            displayName: Diagnóstico da estrutura dos projetos
          - bash: |
              set -euo pipefail
              docker build -f "$(Pipeline.Workspace)/s/onges-infra/docker/core/Dockerfile" -t "$(ACR_LOGIN_SERVER)/$(coreImageRepository):$(Build.BuildId)" -t "$(ACR_LOGIN_SERVER)/$(coreImageRepository):latest" "$(Pipeline.Workspace)/s/onges-core"
              docker build -f "$(Pipeline.Workspace)/s/onges-infra/docker/worker/Dockerfile" -t "$(ACR_LOGIN_SERVER)/$(workerImageRepository):$(Build.BuildId)" -t "$(ACR_LOGIN_SERVER)/$(workerImageRepository):latest" "$(Pipeline.Workspace)/s/onges-worker"
            displayName: Construir imagens
          - bash: |
              set -euo pipefail
              echo "Baixando imagem do Trivy..."
              docker pull aquasec/trivy:0.58.2
              echo "Analisando imagem do Core..."
              docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.58.2 \
              image \
              --exit-code 0 \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              "$(ACR_LOGIN_SERVER)/$(coreImageRepository):$(Build.BuildId)"
              echo "Analisando imagem do Worker..."
              docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.58.2 \
              image \
              --exit-code 0 \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              "$(ACR_LOGIN_SERVER)/$(workerImageRepository):$(Build.BuildId)"
            displayName: Trivy
          - bash: |
              set -euo pipefail
              docker push "$(ACR_LOGIN_SERVER)/$(coreImageRepository):$(Build.BuildId)"
              docker push "$(ACR_LOGIN_SERVER)/$(coreImageRepository):latest"
              docker push "$(ACR_LOGIN_SERVER)/$(workerImageRepository):$(Build.BuildId)"
              docker push "$(ACR_LOGIN_SERVER)/$(workerImageRepository):latest"
            displayName: Push no ACR
